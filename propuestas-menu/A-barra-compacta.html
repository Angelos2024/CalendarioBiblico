<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propuesta A — Barra compacta</title>
  <style>
    :root {
      --bg: #f0ede4; --panel: #fffdf8; --border: #c8b78a; --strong: #9f8750;
      --head: #7a3a0a; --text: #1d1d1d; --muted: #666; --accent: #7a5c1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .mock-label {
      position: sticky; top: 0; z-index: 20;
      background: #2c2418; color: #f5e6c8; font-size: .78rem;
      padding: 8px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .mock-label a { color: #f5e6c8; }

    /* Orden: [Logo] → [Búsqueda + GPS] → [Año] → [Más] → [Calcular] */
    .topbar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 2px solid var(--strong);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
      align-self: center;
      padding-bottom: 2px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--head); color: #fff;
      display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-text strong {
      display: block; font-size: .88rem; color: var(--head); line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
    }
    .brand-text span { font-size: .68rem; color: var(--muted); }

    /* Buscador con lupa (izq) + GPS (der) dentro del mismo control */
    .search-wrap {
      flex: 1 1 280px;
      min-width: 220px;
    }
    .search-wrap > label {
      display: block; font-size: .72rem; font-weight: 700; color: var(--accent);
      margin-bottom: 3px;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 92, 30, .12);
    }
    .search-ico {
      position: absolute;
      left: 11px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; pointer-events: none; opacity: .55;
    }
    .search-box input {
      flex: 1; min-width: 0;
      border: none; outline: none;
      padding: 10px 78px 10px 34px;
      font: inherit; font-size: .9rem;
      background: transparent;
    }
    .btn-gps {
      position: absolute;
      right: 3px; top: 50%; transform: translateY(-50%);
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--head);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 4px 8px;
      min-width: 56px;
      line-height: 1;
      transition: background .12s;
    }
    .btn-gps:hover { background: #f3e7d4; }
    .btn-gps:focus-visible {
      outline: 2px solid var(--head);
      outline-offset: 1px;
    }
    .btn-gps svg { width: 16px; height: 16px; display: block; flex-shrink: 0; }
    .btn-gps span {
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--accent);
      white-space: nowrap;
    }

    .field-year { flex: 0 0 auto; }
    .field-year label {
      display: block; font-size: .72rem; font-weight: 700; color: var(--accent); margin-bottom: 3px;
    }
    .field-year input {
      width: 88px; padding: 10px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #fff; font: inherit; font-size: .9rem; font-weight: 700;
    }

    .btn-calc, .btn-more {
      border: none; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer;
      padding: 10px 14px; white-space: nowrap; font-size: .88rem;
      height: 40px;
    }
    .btn-calc { background: var(--head); color: #fff; }
    .btn-calc:hover { opacity: .9; }
    .btn-more {
      background: transparent; color: var(--muted);
      border: 1px dashed var(--border);
    }
    .btn-more:hover { border-color: var(--accent); color: var(--accent); }

    .adv {
      display: none; padding: 12px 16px; background: #fff8f0;
      border-bottom: 1px solid var(--border);
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .adv.open { display: grid; }
    .adv .field label { font-size: .72rem; font-weight: 700; color: var(--accent); display: block; margin-bottom: 3px; }
    .adv input, .adv select {
      width: 100%; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px;
      background: #fff; font: inherit; font-size: .85rem;
    }

    .fake-cal {
      margin: 24px auto; max-width: 720px; padding: 0 16px;
      color: var(--muted); text-align: center;
    }
    .fake-cal .box {
      margin-top: 12px; height: 180px; border: 2px dashed var(--border);
      border-radius: 12px; display: grid; place-items: center; background: #fff;
      font-size: .9rem;
    }
    @media (max-width: 700px) {
      .brand-text strong { max-width: 120px; }
      .search-wrap { flex: 1 1 100%; }
      .btn-calc { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="mock-label">
    <span><strong>Propuesta A v2</strong> — GPS dentro del buscador (derecha)</span>
    <a href="index.html">← Volver a propuestas</a>
  </div>

  <div class="topbar">
    <!-- 1. Logo -->
    <div class="brand" title="Calendario Caraita Astronómico">
      <div class="brand-mark" aria-hidden="true">📅</div>
      <div class="brand-text">
        <strong>Calendario Caraita</strong>
        <span>Astronómico</span>
      </div>
    </div>

    <!-- 2. Barra de búsqueda con GPS a la derecha (mismo bloque visual) -->
    <div class="search-wrap">
      <label for="city">Ciudad</label>
      <div class="search-box">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          id="city"
          type="search"
          placeholder="Buscar ciudad… Chihuahua, Jerusalem…"
          aria-label="Buscar ciudad"
        />
        <button
          type="button"
          class="btn-gps"
          title="Usar GPS"
          aria-label="Usar GPS para detectar mi ubicación"
        >
          <!-- Pin de ubicación (estilo común: Maps / WhatsApp / Instagram) -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 22s7-7.2 7-12.2A7 7 0 0 0 5 9.8C5 14.8 12 22 12 22z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>usar gps</span>
        </button>
      </div>
    </div>

    <!-- 3. Año -->
    <div class="field-year">
      <label for="year">Año</label>
      <input id="year" type="text" value="2026" />
    </div>

    <!-- 4. Más -->
    <button type="button" class="btn-more" onclick="document.getElementById('adv').classList.toggle('open')">
      ⚙ Más
    </button>

    <!-- 5. Calcular -->
    <button type="button" class="btn-calc">Calcular</button>
  </div>

  <div class="adv" id="adv">
    <div class="field"><label>Zona horaria</label><input value="Asia/Jerusalem" /></div>
    <div class="field"><label>Latitud</label><input value="31.768300" /></div>
    <div class="field"><label>Longitud</label><input value="35.213700" /></div>
    <div class="field"><label>Elevación (m)</label><input value="800" /></div>
    <div class="field"><label>Aviv inicia en</label><select><option>Marzo</option><option>Abril</option></select></div>
    <div class="field"><label>Visibilidad creciente</label><select><option>Estándar</option></select></div>
    <div class="field"><label>Meses</label><select><option>Auto (12/13)</option></select></div>
  </div>

  <div class="fake-cal">
    <p>El GPS vive dentro del buscador: primero “busco ciudad”, luego descubro el atajo GPS.</p>
    <div class="box">Área del calendario (mock)</div>
  </div>
</body>
</html>
