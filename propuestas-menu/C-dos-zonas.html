<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propuesta C — Dos zonas</title>
  <style>
    :root {
      --bg: #f0ede4; --panel: #fffdf8; --border: #c8b78a; --strong: #9f8750;
      --head: #7a3a0a; --text: #1d1d1d; --muted: #666; --accent: #7a5c1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .mock-label {
      position: sticky; top: 0; z-index: 20;
      background: #2c2418; color: #f5e6c8; font-size: .78rem;
      padding: 8px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .mock-label a { color: #f5e6c8; }

    .menu {
      margin: 12px 16px 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .zones {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 0;
    }
    @media (max-width: 820px) {
      .zones { grid-template-columns: 1fr; }
    }

    .zone {
      padding: 14px 16px;
    }
    .zone-left {
      background: linear-gradient(160deg, #fdf6ec, #fff);
      border-right: 1px solid var(--border);
    }
    @media (max-width: 820px) {
      .zone-left { border-right: none; border-bottom: 1px solid var(--border); }
    }

    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--head); color: #fff;
      display: grid; place-items: center; font-size: 1.15rem;
    }
    .brand strong { display: block; color: var(--head); font-size: .95rem; }
    .brand span { font-size: .72rem; color: var(--muted); }

    .sec-title {
      font-size: .72rem; font-weight: 800; letter-spacing: .05em;
      text-transform: uppercase; color: var(--head); margin-bottom: 8px;
    }

    .stack { display: flex; flex-direction: column; gap: 8px; }
    .btn-geo {
      background: var(--head); color: #fff; border: none; border-radius: 10px;
      padding: 12px 14px; font: inherit; font-size: .92rem; font-weight: 700;
      cursor: pointer; min-height: 46px;
    }
    input[type="search"], input[type="text"], select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--panel); font: inherit; font-size: .9rem;
    }

    .params {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .params .full { grid-column: 1 / -1; }
    .field label {
      display: block; font-size: .72rem; font-weight: 700; color: var(--accent); margin-bottom: 3px;
    }
    .btn-calc {
      width: 100%; background: var(--head); color: #fff; border: none; border-radius: 10px;
      padding: 12px 14px; font: inherit; font-size: .95rem; font-weight: 800;
      cursor: pointer; min-height: 48px; margin-top: 4px;
    }
    .btn-more {
      width: 100%; margin-top: 8px;
      background: transparent; border: 1px dashed var(--border); border-radius: 8px;
      padding: 8px; font: inherit; font-size: .8rem; color: var(--muted); cursor: pointer;
    }

    .tech {
      display: none; padding: 0 16px 14px;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
      background: #fff8f0; border-top: 1px solid var(--border);
    }
    .tech.open { display: grid; padding-top: 12px; }
    .tech label { font-size: .7rem; font-weight: 700; color: var(--accent); display: block; margin-bottom: 3px; }
    .tech input, .tech select {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
      background: #fff; font: inherit; font-size: .84rem;
    }

    .fake-cal {
      margin: 20px 16px; color: var(--muted); text-align: center; font-size: .9rem;
    }
    .fake-cal .box {
      margin-top: 10px; height: 160px; border: 2px dashed var(--border);
      border-radius: 12px; display: grid; place-items: center; background: #fff;
    }
  </style>
</head>
<body>
  <div class="mock-label">
    <span><strong>Propuesta C</strong> — Dos zonas (lugar | calendario)</span>
    <a href="index.html">← Volver a propuestas</a>
  </div>

  <div class="menu">
    <div class="zones">
      <div class="zone zone-left">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">📅</div>
          <div>
            <strong>Calendario Caraita</strong>
            <span>Astronómico · por observación</span>
          </div>
        </div>
        <div class="sec-title">Tu ubicación</div>
        <div class="stack">
          <button type="button" class="btn-geo">🎯 Detectar mi ubicación</button>
          <input type="search" placeholder="O busca una ciudad…" aria-label="Buscar ciudad" />
        </div>
      </div>

      <div class="zone">
        <div class="sec-title">Calendario</div>
        <div class="params">
          <div class="field">
            <label for="year">Año</label>
            <input id="year" type="text" value="2026" />
          </div>
          <div class="field">
            <label for="aviv">Aviv inicia</label>
            <select id="aviv"><option>Marzo</option><option>Abril</option></select>
          </div>
          <div class="field full">
            <label for="cres">Visibilidad del creciente</label>
            <select id="cres"><option>Estándar</option><option>Estricto</option><option>Flexible</option></select>
          </div>
          <div class="field full">
            <button type="button" class="btn-calc">Calcular calendario</button>
            <button type="button" class="btn-more" onclick="document.getElementById('tech').classList.toggle('open')">
              Mostrar latitud, longitud y zona horaria
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="tech" id="tech">
      <div><label>Zona horaria</label><input value="Asia/Jerusalem" /></div>
      <div><label>Latitud</label><input value="31.768300" /></div>
      <div><label>Longitud</label><input value="35.213700" /></div>
      <div><label>Elevación (m)</label><input value="800" /></div>
      <div><label>Meses</label><select><option>Auto (12/13)</option></select></div>
    </div>
  </div>

  <div class="fake-cal">
    <p>Agrupa “dónde” vs “qué calendario”, sin fila interminable de 8 campos.</p>
    <div class="box">Área del calendario (mock)</div>
  </div>
</body>
</html>
